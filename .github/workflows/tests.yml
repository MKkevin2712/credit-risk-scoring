# Intégration continue : à chaque push ou pull request, vérifie le style du code et lance les tests.
# Les tests n'utilisent que des données fictives : ils tournent sans les données Kaggle.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Installer Python 3.12 et les dépendances
        run: uv sync --frozen

      - name: Vérifier le style (ruff)
        run: uv run ruff check src tests app

      - name: Lancer les tests (pytest)
        run: uv run pytest -p no:warnings
